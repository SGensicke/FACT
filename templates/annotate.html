  const newBtn = document.getElementById('mode-new-btn');
  const saveBtn = document.getElementById('save-formula-btn');
  
  if (mode === 'search') {
    searchMode.style.display = 'block';
    newMode.style.display = 'none';
    searchBtn.classList.add('active');
    newBtn.classList.remove('active');
    saveBtn.textContent = 'Link Variant';
    setTimeout(() => document.getElementById('formula-search-input').focus(), 50);
  } else {
    searchMode.style.display = 'none';
    newMode.style.display = 'block';
    searchBtn.classList.remove('active');
    newBtn.classList.add('active');
    saveBtn.textContent = 'Create Formula & Link Variant';
    setTimeout(() => document.getElementById('new-formula-input').focus(), 50);
  }
}

async function searchFormulae() {
  const query = document.getElementById('formula-search-input').value.trim();
  const resultsEl = document.getElementById('formula-search-results');
  
  if (!query) {
    resultsEl.innerHTML = '';
    return;
  }
  
  clearTimeout(formulaSearchTimeout);
  formulaSearchTimeout = setTimeout(async () => {
    try {
      resultsEl.innerHTML = '<div class="formula-search-empty"><span class="spinner"></span></div>';
      
      // Fetch all formulae if not cached
      if (!allFormulae.length) {
        allFormulae = await api('/api/ideale');
      }
      
      // Search in formulae
      const queryLower = query.toLowerCase();
      const matches = allFormulae.filter(f => 
        f.formulierung.toLowerCase().includes(queryLower)
      ).slice(0, 50); // Limit to 50 results
      
      if (matches.length === 0) {
        resultsEl.innerHTML = '<div class="formula-search-empty">No formulae found</div>';
        return;
      }
      
      resultsEl.innerHTML = matches.map(f => {
        const tag = tags.find(t => f.kategorie_ids?.includes(t.id));
        const katName = tag?.name || '';
        const katColor = tag?.color || '';
        const variantCount = f.varianten_anzahl || f.anzahl_varianten || 0;
        return `
          <div class="formula-result-card" onclick="selectFormula(${f.id})">
            <div class="formula-head">
              <span class="formula-text">${esc(f.formulierung)}</span>
              ${katName ? `<span class="tag-badge" ${katColor ? `style="background:${katColor};"` : ''}>${esc(katName)}</span>` : ''}
              ${variantCount ? `<span class="var-count-badge" title="${variantCount} linked variant(s)">${variantCount} ⇄</span>` : ''}
            </div>
          </div>
        `;
      }).join('');
    } catch (e) {
      resultsEl.innerHTML = '<div class="formula-search-empty">Error loading formulae</div>';
      console.error(e);
    }
  }, 300);
}

function selectFormula(formulaId) {
  document.getElementById('selected-formula-id').value = formulaId;
  document.querySelectorAll('.formula-result-card').forEach(item => item.classList.remove('selected'));
  event.target.closest('.formula-result-card').classList.add('selected');
}

async function saveFormulaLink() {
  const mode = document.getElementById('mode-search-btn').classList.contains('active') ? 'search' : 'new';
  const xmlid = document.getElementById('new-xmlid').value;
  const varText = document.getElementById('new-var-text').textContent;
  
  let formulaId;
  
  if (mode === 'search') {
    // Link to existing formula
    formulaId = document.getElementById('selected-formula-id').value;
    if (!formulaId) {
      toast('Please select a formula');
      return;
    }
  } else {
    // Create new formula
    const formula = document.getElementById('new-formula-input').value.trim();
    if (!formula) {
      toast('Formula required');
      return;
    }
    const tagIds = tagWidgetGetSelected('new-tag-widget');
    const note = document.getElementById('new-note-input').value.trim() || null;
    
    const f = await api('/api/ideale', 'POST', { formulierung: formula, kategorie_ids: tagIds, notiz: note });
    formulaId = f.id;
    allFormulae = []; // Clear cache to refresh
  }
  
  // Create variant link
  const payload = { ideal_id: parseInt(formulaId), text_xmlid: xmlid, string: varText };
  if (selection && selection.xmlid === xmlid) {
    payload.offset_start = selection.start;
    payload.offset_end = selection.end;
  }
  
  const result = await api('/api/varianten/bulk', 'POST', payload);
  closeNewFormulaModal();
  
  const tagStr = [result.tag_region, result.tag_textteil].filter(Boolean).join(' · ');
  toast(`Variant linked ✓${tagStr ? '  [' + tagStr + ']' : ''}`);
  
  linkedIds.add(xmlid);
  if (activeElement) {
    await loadElement(activeElement.xmlid);
    await refreshTreePct(activeElement.xmlid);
  }
}

async function saveNewFormula() {
  // This function is kept for backward compatibility but redirects to saveFormulaLink
  await saveFormulaLink();
}

document.getElementById('new-formula-overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeNewFormulaModal(); });

// ── Utilities ──────────────────────────────────────────────────────────────
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3200);
}

init().then(async () => {
  try {
    const inv  = await api('/api/varianten/invalidiert');
    const link = document.getElementById('inv-link');
    if (link && inv.length > 0) {
      link.textContent = `⚠ ${inv.length} invalid`;
      link.style.color = '#e07070'; link.style.borderColor = '#e07070';
    } else if (link) {
      link.textContent = '✓ All valid';
      link.style.color = '#6aaa60'; link.style.borderColor = '#6aaa60';
    }
  } catch (e) {}
  const params = new URLSearchParams(location.search);
  const xmlid  = params.get('xmlid');
  if (xmlid) { loadElement(xmlid); history.replaceState({}, '', '/annotate'); }
});
